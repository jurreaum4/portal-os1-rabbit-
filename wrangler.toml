name = "portal-os1-rabbit-worker"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-10-30"

[vars]
ENV = "production"
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,https://portal-os1-rabbit-worker.jurreaum4.workers.dev"
ICVS_ENABLED = "true"
MAX_PROCESS_HEAP_BYTES = 2097152 # 2MB Hard Cap

[[d1_databases]]
binding = "DB"
database_name = "portal-os1-db"
database_id = "2279f36a-a244-499c-aa55-5d1eec6c2fb5"
migrations_dir = "apps/worker/d1/migrations"

[durable_objects]
bindings = [
  { name = "MICROKERNEL_ACTOR", class_name = "MicrokernelProcessActor" },
  { name = "FACTORY_ACTOR", class_name = "ProductFactoryActor" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MicrokernelProcessActor"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ProductFactoryActor"]

[triggers]
crons = ["* * * * *"]
